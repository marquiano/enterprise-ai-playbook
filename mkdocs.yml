site_name: Enterprise AI Playbook
site_description: Engineering knowledge base for Enterprise AI systems
site_author: Marquiano

theme:
  name: material

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: README.md
  - Foundations:
      - Engineering Principles: docs/principles/ENTERPRISE_AI_PRINCIPLES.md
      - Engineering Lifecycle: docs/lifecycle/ENTERPRISE_AI_LIFECYCLE.md
  - Architecture:
      - Reference Architecture: docs/reference-architectures/ENTERPRISE_AI_REFERENCE_ARCHITECTURE.md
      - Knowledge Graph: docs/architecture/ENTERPRISE_AI_KNOWLEDGE_GRAPH.md
  - Reference Models:
      - Maturity Model: docs/reference-models/ENTERPRISE_AI_MATURITY_MODEL.md
  - Engineering Decisions:
      - Decision Record Standard: docs/engineering-decisions/README.md
      - EDR-0001 — Playbook Scope: docs/engineering-decisions/EDR-0001-PLAYBOOK-SCOPE.md
      - EDR-0002 — Model Routing Strategy: docs/engineering-decisions/EDR-0002-MODEL-ROUTING-STRATEGY.md
  - Evaluation:
      - Evaluation Strategy: docs/evaluation/ENTERPRISE_AI_EVALUATION_STRATEGY.md
  - Operational Playbooks:
      - Cost and Model-Routing Playbook: docs/operational-playbooks/COST_AND_MODEL_ROUTING_PLAYBOOK.md
  - Incident Playbooks:
      - AI Incident and Rollback Playbook: docs/incident-playbooks/AI_INCIDENT_AND_ROLLBACK_PLAYBOOK.md
  - Case Studies:
      - "Case Study 0001 (Illustrative)": docs/case-studies/CASE-STUDY-0001-ILLUSTRATIVE-SUPPORT-TRIAGE.md
  - Reference:
      - Engineering Artifact Catalog: docs/ENGINEERING_ARTIFACT_CATALOG.md
  - Roadmap: ROADMAP.md
