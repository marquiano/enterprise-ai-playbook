site_name: Enterprise AI Playbook
site_description: Engineering knowledge base for Enterprise AI systems
site_author: Marquiano

theme:
  name: material

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path:
        - "."
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Foundations:
      - Engineering Principles: principles/ENTERPRISE_AI_PRINCIPLES.md
      - Engineering Lifecycle: lifecycle/ENTERPRISE_AI_LIFECYCLE.md
  - Architecture:
      - Reference Architecture: reference-architectures/ENTERPRISE_AI_REFERENCE_ARCHITECTURE.md
      - Enterprise Agent Architecture: reference-architectures/ENTERPRISE_AGENT_ARCHITECTURE.md
      - Enterprise RAG Architecture: reference-architectures/ENTERPRISE_RAG_ARCHITECTURE.md
      - Knowledge Graph: architecture/ENTERPRISE_AI_KNOWLEDGE_GRAPH.md
  - Reference Models:
      - Maturity Model: reference-models/ENTERPRISE_AI_MATURITY_MODEL.md
  - Engineering Decisions:
      - Decision Record Standard: engineering-decisions/README.md
      - EDR-0001 — Playbook Scope: engineering-decisions/EDR-0001-PLAYBOOK-SCOPE.md
      - EDR-0002 — Model Routing Strategy: engineering-decisions/EDR-0002-MODEL-ROUTING-STRATEGY.md
      - EDR-0003 — Agent Tool-Scope and Permission Boundary: engineering-decisions/EDR-0003-AGENT-TOOL-PERMISSION-BOUNDARY.md
      - EDR-0004 — Retrieval Grounding and Citation Enforcement: engineering-decisions/EDR-0004-RETRIEVAL-GROUNDING-AND-CITATION.md
      - EDR-0005 — AI Use-Case Risk Classification and Approval Gate: engineering-decisions/EDR-0005-USE-CASE-RISK-CLASSIFICATION-AND-APPROVAL-GATE.md
  - Security:
      - Prompt Injection and Jailbreak Defense: engineering-patterns/PROMPT_INJECTION_AND_JAILBREAK_DEFENSE.md
  - Observability:
      - Enterprise AI Observability Pattern: engineering-patterns/ENTERPRISE_AI_OBSERVABILITY_PATTERN.md
  - Evaluation:
      - Evaluation Strategy: evaluation/ENTERPRISE_AI_EVALUATION_STRATEGY.md
  - Operational Playbooks:
      - Cost and Model-Routing Playbook: operational-playbooks/COST_AND_MODEL_ROUTING_PLAYBOOK.md
      - AI Governance Review Playbook: operational-playbooks/AI_GOVERNANCE_REVIEW_PLAYBOOK.md
      - AI Production Operations Playbook: operational-playbooks/AI_PRODUCTION_OPERATIONS_PLAYBOOK.md
  - Incident Playbooks:
      - AI Incident and Rollback Playbook: incident-playbooks/AI_INCIDENT_AND_ROLLBACK_PLAYBOOK.md
  - Case Studies:
      - "Case Study 0001 (Illustrative)": case-studies/CASE-STUDY-0001-ILLUSTRATIVE-SUPPORT-TRIAGE.md
  - Reference:
      - Engineering Artifact Catalog: ENGINEERING_ARTIFACT_CATALOG.md
  - Roadmap: roadmap.md
